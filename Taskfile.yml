version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  init:
    desc: Install dependencies and create the virtual environment
    cmds:
      - uv sync
      - echo "Created virtual environment"

  test:
    desc: Run the test suite with coverage
    cmds:
      - uv run pytest --cov=ekf_slam_3d/ --cov-report=term-missing --no-cov-on-fail

  demo:
    desc: Run the full SLAM pipeline with a live animated plot (same as demo:slam)
    cmds:
      - task: demo:slam

  demo:slam:
    desc: "Run SLAM (pose + map unknown) live; pick a dataset with: task demo:slam -- --scenario <name>"
    cmds:
      - uv run python examples/ekf_slam_example.py {{.CLI_ARGS}}

  demo:mapping:
    desc: Run mapping (pose known, map unknown) with a live animated plot
    cmds:
      - uv run python examples/ekf_mapping_example.py

  demo:localization:
    desc: Run localization (map known, pose unknown) with a live animated plot
    cmds:
      - uv run python examples/ekf_localization_example.py

  format:
    desc: Format, lint, and type-check the code
    cmds:
      - uv run ruff format
      - uv run ruff check --fix
      - uv run mypy ekf_slam_3d/ tests/ config/ examples/ --ignore-missing-imports

  clean:
    desc: Remove the virtual environment, caches, and build artifacts
    cmds:
      - rm -rf .venv
      - rm -rf .mypy_cache
      - rm -rf .pytest_cache
      - rm -rf .ruff_cache
      - rm -rf build/
      - rm -rf dist/
      - rm -rf juninit-pytest.xml
      - find . -name ".coverage*" -delete
      - find . -name "__pycache__" -exec rm -r {} +
